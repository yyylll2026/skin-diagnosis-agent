# =============================================================================
# Alembic configuration — CLI convenience only.
#
# NOTE: this file is intentionally ASCII-only.
# Alembic reads the ini with `encoding="locale"` (see alembic/util/compat.py),
# so on a zh-CN Windows box (cp936) any non-ASCII comment here makes
# `alembic upgrade head` die with UnicodeDecodeError before it even connects.
# The application itself does NOT depend on this file: `run_migrations()`
# builds the Config programmatically, so a container that forgets to copy
# this file still starts fine — only the CLI would be unavailable.
#
# `sqlalchemy.url` is deliberately left empty. The URL is injected by
# app/repositories/database.py through `config.attributes`, because the ini
# goes through configparser and a `%` in a URL-encoded password would be
# treated as interpolation syntax.
# =============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =
