[project]
name = "skin-diagnosis-agent"
version = "0.1.0"
description = "基于 Ollama + Qwen2.5-VL + LangGraph + Chroma 的皮肤诊断智能体后端"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # ---- Web 层 ----
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # ---- 鉴权 ----
    # 直接用 bcrypt 而不是 passlib：passlib 已基本停止维护，
    # 而我们只需要 hashpw/checkpw 两个函数，不值得引入一层包装。
    "bcrypt>=4.0.0",
    "sse-starlette>=2.1.3",
    "httpx>=0.27.2",
    # ---- 配置与校验 ----
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # ---- 数据层 ----
    # 只用 SQLAlchemy 的 Core（连接 + 方言适配），查询仍是显式 SQL，不引入 ORM；
    # Alembic 负责 schema 版本管理，运行时不再执行 DDL。
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    # 仅当 SKIN_DATABASE_URL 指向 postgresql+psycopg:// 时才会真正加载
    "psycopg[binary]>=3.2.3",
    # ---- LangChain / LangGraph 编排 ----
    "langchain>=0.3.10",
    "langchain-core>=0.3.20",
    "langchain-ollama>=0.2.1",
    # SKIN_LLM_BACKEND=cloud 时的 OpenAI 兼容客户端（百炼 / 任意 compatible-mode）
    "langchain-openai>=0.2.0",
    "langchain-chroma>=0.1.4",
    "langchain-text-splitters>=0.3.2",
    "langgraph>=0.2.50",
    # ---- 向量库与检索 ----
    "chromadb>=0.5.20",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    # ---- 文档解析 ----
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "beautifulsoup4>=4.12.3",
    # ---- 图像处理 ----
    "pillow>=11.0.0",
    # ---- CLI / 日志 ----
    "typer>=0.12.5",
    "rich>=13.9.4",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
# 若不想用 Ollama 做 embedding，可安装本 extra 走本地 sentence-transformers
hf = ["sentence-transformers>=3.3.0"]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
# backend/alembic/ 是 Alembic 约定的迁移目录（无 __init__.py）。
# 不显式声明的话，isort 会把 `import alembic` 当成项目内的一方导入，
# 把依赖装进错误的 import 分组里。
known-third-party = ["alembic"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[project.scripts]
skin-kb = "scripts.ingest_cli:app"
